<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-label="Development pathway compared: North America versus China">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eff7fe"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0577c4"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d81348"/>
    </marker>
    <style>
      .h{font-family:Inter,'Segoe UI',sans-serif;font-weight:900;fill:#06182c}
      .n{font-family:Inter,'Segoe UI',sans-serif;font-weight:700;fill:#06182c;font-size:14px}
      .s{font-family:Inter,'Segoe UI',sans-serif;font-weight:400;fill:#41586f;font-size:12px}
      .lbl{font-family:Inter,'Segoe UI',sans-serif;font-weight:900;font-size:12px;letter-spacing:1.4px}
      .boxA{fill:#ffffff;stroke:#0577c4;stroke-opacity:.42;stroke-width:1.5}
      .boxB{fill:#ffffff;stroke:#d81348;stroke-opacity:.42;stroke-width:1.5}
      .flowA{stroke:#0577c4;stroke-width:2.5;fill:none;stroke-opacity:.8}
      .flowB{stroke:#d81348;stroke-width:2.5;fill:none;stroke-opacity:.8}
    </style>
  </defs>
  <rect width="980" height="560" fill="url(#bgp)"/>

  <text class="h" x="490" y="42" font-size="22" text-anchor="middle">Two systems, one decisive age</text>
  <text class="s" x="490" y="66" text-anchor="middle" font-size="13">What happens to a player at sixteen</text>

  <!-- AGE AXIS -->
  <line x1="80" y1="288" x2="900" y2="288" stroke="#8fa8bd" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 6"/>
  <g class="s" text-anchor="middle" font-size="11.5">
    <text x="150" y="306">age 6</text>
    <text x="330" y="306">age 12</text>
    <text x="520" y="306">age 16</text>
    <text x="700" y="306">age 18</text>
    <text x="860" y="306">age 22</text>
  </g>
  <!-- the 16 marker -->
  <line x1="520" y1="96" x2="520" y2="480" stroke="#d81348" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="470" y="80" width="100" height="24" rx="12" fill="#d81348" fill-opacity=".12" stroke="#d81348" stroke-opacity=".45"/>
  <text class="lbl" x="520" y="97" fill="#d81348" text-anchor="middle">AGE 16</text>

  <!-- ============ TOP TRACK: North America ============ -->
  <text class="lbl" x="80" y="140" fill="#0577c4">NORTH AMERICA · US &amp; CANADA</text>

  <rect class="boxA" x="80" y="152" width="140" height="62" rx="12"/>
  <text class="n" x="150" y="178" text-anchor="middle">School / club</text>
  <text class="s" x="150" y="196" text-anchor="middle">house league, all levels</text>

  <rect class="boxA" x="262" y="152" width="140" height="62" rx="12"/>
  <text class="n" x="332" y="178" text-anchor="middle">Tiered leagues</text>
  <text class="s" x="332" y="196" text-anchor="middle">rec → AAA → Junior</text>

  <rect class="boxA" x="452" y="152" width="140" height="62" rx="12"/>
  <text class="n" x="522" y="172" text-anchor="middle">Scholastic sport</text>
  <text class="s" x="522" y="190" text-anchor="middle">hockey helps you</text>
  <text class="s" x="522" y="204" text-anchor="middle">get into college</text>

  <rect class="boxA" x="634" y="152" width="140" height="62" rx="12"/>
  <text class="n" x="704" y="178" text-anchor="middle">NCAA / Junior</text>
  <text class="s" x="704" y="196" text-anchor="middle">scholarship + degree</text>

  <rect x="816" y="152" width="112" height="62" rx="12" fill="#0577c4"/>
  <text x="872" y="172" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="13" fill="#fff">Pro OR</text>
  <text x="872" y="190" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="13" fill="#fff">graduate</text>
  <text x="872" y="206" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#bfe0f7">both work</text>

  <path class="flowA" d="M220,183 H256" marker-end="url(#arw)"/>
  <path class="flowA" d="M402,183 H446" marker-end="url(#arw)"/>
  <path class="flowA" d="M592,183 H628" marker-end="url(#arw)"/>
  <path class="flowA" d="M774,183 H810" marker-end="url(#arw)"/>

  <!-- dual career band -->
  <rect x="80" y="228" width="848" height="26" rx="13" fill="#0577c4" fill-opacity=".08" stroke="#0577c4" stroke-opacity=".25"/>
  <text class="lbl" x="504" y="246" fill="#0577c4" text-anchor="middle">EDUCATION AND ATHLETICS RUN IN PARALLEL — NO CHOICE REQUIRED</text>

  <!-- ============ BOTTOM TRACK: China ============ -->
  <text class="lbl" x="80" y="346" fill="#d81348">CHINA</text>

  <rect class="boxB" x="80" y="358" width="140" height="62" rx="12"/>
  <text class="n" x="150" y="384" text-anchor="middle">Interest class</text>
  <text class="s" x="150" y="402" text-anchor="middle">if a rink exists nearby</text>

  <rect class="boxB" x="262" y="358" width="140" height="62" rx="12"/>
  <text class="n" x="332" y="384" text-anchor="middle">Club / city team</text>
  <text class="s" x="332" y="402" text-anchor="middle">small talent pool</text>

  <!-- the fork at 16 -->
  <rect class="boxB" x="452" y="330" width="150" height="58" rx="12"/>
  <text class="n" x="527" y="354" text-anchor="middle">Provincial contract</text>
  <text class="s" x="527" y="372" text-anchor="middle">closed-door training</text>

  <rect class="boxB" x="452" y="400" width="150" height="58" rx="12"/>
  <text class="n" x="527" y="424" text-anchor="middle">Quit for the Gaokao</text>
  <text class="s" x="527" y="442" text-anchor="middle">sell the gear</text>

  <path class="flowB" d="M220,389 H256" marker-end="url(#arwR)"/>
  <path class="flowB" d="M402,380 C428,368 430,362 446,358" marker-end="url(#arwR)"/>
  <path class="flowB" d="M402,398 C428,412 430,420 446,428" marker-end="url(#arwR)"/>

  <!-- outcomes -->
  <rect x="646" y="330" width="150" height="58" rx="12" fill="#d81348" fill-opacity=".12" stroke="#d81348" stroke-opacity=".45"/>
  <text class="n" x="721" y="354" text-anchor="middle" fill="#a30f38">Burnout at 17</text>
  <text class="s" x="721" y="372" text-anchor="middle" fill="#a30f38">no education to fall back on</text>

  <rect x="646" y="400" width="150" height="58" rx="12" fill="#d81348" fill-opacity=".12" stroke="#d81348" stroke-opacity=".45"/>
  <text class="n" x="721" y="424" text-anchor="middle" fill="#a30f38">Never plays again</text>
  <text class="s" x="721" y="442" text-anchor="middle" fill="#a30f38">watches the NHL on a phone</text>

  <path class="flowB" d="M602,359 H640" marker-end="url(#arwR)"/>
  <path class="flowB" d="M602,429 H640" marker-end="url(#arwR)"/>

  <!-- the narrow escape -->
  <path d="M602,344 C700,300 780,290 856,286" fill="none" stroke="#00937d" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="862" cy="286" r="7" fill="#00937d"/>
  <text class="lbl" x="880" y="272" fill="#00937d" text-anchor="end" font-size="11">the 0.01% escape</text>

  <!-- binary choice band -->
  <rect x="452" y="474" width="344" height="26" rx="13" fill="#d81348" fill-opacity=".1" stroke="#d81348" stroke-opacity=".3"/>
  <text class="lbl" x="624" y="492" fill="#d81348" text-anchor="middle">STUDENT OR ATHLETE — PICK ONE</text>

  <text class="s" x="490" y="536" text-anchor="middle" font-size="12">
    Based on interviews across the United States, Canada, Japan and China
  </text>
</svg>
